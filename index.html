<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Picker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Want to hear a Story?</h1>

    <button class= "theme">Change Theme</button>
    <main class="story-container">
        <div class="btn-container">

            <button class="btn scary-btn">Scary Story</button>
            <button class="btn funny-btn">Funny Story</button>
            <button class="btn adv-btn">Adventure Story</button>
            <button class="btn myst-btn">Mysterious Story</button>
            <button class="btn sci-fi-btn">Sci-fi Story</button>

        </div>
        <p id="result"></p>

    </main>
    <script src="script.js"></script>
</body>
</html>
